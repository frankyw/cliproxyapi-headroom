name: Test and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: node tests/dashboard_auth.js
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, goos: linux, goarch: amd64, extension: so}
          - {runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, extension: so}
          - {runner: macos-15-intel, goos: darwin, goarch: amd64, extension: dylib}
          - {runner: macos-15, goos: darwin, goarch: arm64, extension: dylib}
          - {runner: windows-2025, goos: windows, goarch: amd64, extension: dll}
    runs-on: ${{ matrix.runner }}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      EXTENSION: ${{ matrix.extension }}
      CGO_ENABLED: '1'
      REPOSITORY_URL: https://github.com/frankyw/cliproxyapi-headroom
      PLUGIN_AUTHOR: frankyw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build native library
        shell: bash
        run: |
          mkdir -p dist
          go build -buildmode=c-shared -trimpath -ldflags="-s -w -X main.repository=$REPOSITORY_URL -X main.author=$PLUGIN_AUTHOR" -o "dist/headroom.$EXTENSION" .
      - name: Package release archive
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: headroom-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/headroom_*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: headroom-*
          path: dist
          merge-multiple: true
      - name: Validate archives and write checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          root=Path('dist')
          archives=sorted(root.glob('headroom_*.zip'))
          assert len(archives)==5, [str(p) for p in archives]
          expected={('linux','amd64'):'.so',('linux','arm64'):'.so',('darwin','amd64'):'.dylib',('darwin','arm64'):'.dylib',('windows','amd64'):'.dll'}
          seen=set()
          lines=[]
          for archive in archives:
              _,version,goos,arch=archive.stem.split('_')
              assert version == '${{ github.ref_name }}'[1:]
              key=(goos,arch)
              assert key in expected and key not in seen
              seen.add(key)
              with zipfile.ZipFile(archive) as z:
                  assert z.namelist()==['headroom'+expected[key]]
                  assert z.testzip() is None
              lines.append(hashlib.sha256(archive.read_bytes()).hexdigest()+'  '+archive.name)
          assert seen==set(expected)
          (root/'checksums.txt').write_text('\n'.join(lines)+'\n')
          PY
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/headroom_*.zip dist/checksums.txt --clobber
          else
            gh release create "$TAG" dist/headroom_*.zip dist/checksums.txt --generate-notes
          fi
