name: Test and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/build.sh
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: test -f "dist/headroom_${TAG#v}_linux_amd64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: headroom-linux-amd64
          path: |
            dist/headroom_*.zip
            dist/checksums.txt
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: headroom-linux-amd64
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/headroom_*.zip dist/checksums.txt --clobber
          else
            gh release create "$TAG" dist/headroom_*.zip dist/checksums.txt --generate-notes
          fi
